services:
  postgres:
    image: postgres:18-alpine
    container_name: gorest-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${GOREST_DATABASE_USER}
      POSTGRES_PASSWORD: ${GOREST_DATABASE_PASSWORD}
      POSTGRES_DB: ${GOREST_DATABASE_NAME}

    ports:
      - "${GOREST_DATABASE_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GOREST_DATABASE_USER} -d ${GOREST_DATABASE_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:latest
    container_name: gorest-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${GOREST_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${GOREST_STORAGE_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.26.1
    container_name: gorest-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
  
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gorest-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      GOREST_SERVER_HOST: 0.0.0.0

      GOREST_DATABASE_HOST: postgres
      GOREST_DATABASE_PORT: 5432

      GOREST_STORAGE_ENDPOINT: http://minio:9000
      GOREST_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000

      GOREST_LOGGER_LEVEL: debug
      GOREST_LOGGER_FORMAT: json
      GOREST_LOGGER_ADD_SOURCE: "true"

      GOREST_MAILER_DRIVER: mailpit
      GOREST_MAILER_FROM: Flourish <noreply@localhost>
      GOREST_MAILER_SMTP_HOST: mailpit
      GOREST_MAILER_SMTP_PORT: "1025"

      GOREST_APP_PUBLIC_URL: http://localhost:5173
      GOREST_AUTH_INVITE_TTL: 168h
      GOREST_AUTH_RESET_TTL: 1h

    ports:
      - "${GOREST_SERVER_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: gorest-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  loki:
    image: grafana/loki:3.4.3
    container_name: gorest-loki
    restart: unless-stopped
    user: "0"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./deployments/loki/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    depends_on:
      - api

  promtail:
    image: grafana/promtail:3.4.3
    container_name: gorest-promtail
    restart: unless-stopped
    user: "0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deployments/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - api

  grafana:
    image: grafana/grafana:12.1.1
    container_name: gorest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
