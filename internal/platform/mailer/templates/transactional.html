<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Heading}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #171717;
      font-family: 'Manrope', 'Segoe UI', Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f5f5f5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="520"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 520px;
              max-width: 100%;
              background-color: #ffffff;
              border: 1px solid #e0e0e0;
              border-radius: 8px;
            "
          >
            <tr>
              <td style="padding: 32px 32px 8px 32px">
                <p
                  style="
                    margin: 0;
                    font-size: 16px;
                    font-weight: 600;
                    letter-spacing: -0.02em;
                    color: #171717;
                  "
                >
                  {{.BrandName}}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 0 32px">
                <h1
                  style="
                    margin: 0 0 12px 0;
                    font-size: 22px;
                    line-height: 1.3;
                    font-weight: 600;
                    letter-spacing: -0.02em;
                    color: #171717;
                  "
                >
                  {{.Heading}}
                </h1>
                <p
                  style="
                    margin: 0 0 24px 0;
                    font-size: 15px;
                    line-height: 1.5;
                    color: #171717;
                  "
                >
                  {{.Body}}
                </p>
                {{if .ActionURL}}
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      bgcolor="#cf9fff"
                      style="
                        background-color: #cf9fff;
                        border-radius: 8px;
                      "
                    >
                      <a
                        href="{{.ActionURL}}"
                        style="
                          display: inline-block;
                          padding: 12px 20px;
                          font-size: 15px;
                          font-weight: 600;
                          line-height: 1.2;
                          color: #171717;
                          text-decoration: none;
                        "
                      >
                        {{.ActionLabel}}
                      </a>
                    </td>
                  </tr>
                </table>
                {{end}}
                {{if .Expiry}}
                <p
                  style="
                    margin: 16px 0 0 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: #6b6b6b;
                  "
                >
                  {{.Expiry}}
                </p>
                {{end}}
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 32px 32px">
                <p
                  style="
                    margin: 0;
                    padding-top: 16px;
                    border-top: 1px solid #e0e0e0;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #6b6b6b;
                  "
                >
                  If you did not expect this email, you can ignore it.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
