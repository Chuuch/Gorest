app:
  name: gorest
  environment: development

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

database:
  host: localhost
  port: 5432
  user: gorest
  ssl_mode: disable
  max_connections: 20
  min_connections: 3
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m
  health_check_period: 1m

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  issuer: gorest

logger:
  level: debug
  format: text
  add_source: true
