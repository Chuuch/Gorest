server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gorest-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["gorest-api"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - replacement: gorest-api
        target_label: job
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            msg: msg
            method: method
            route: route
            status: status
            duration_ms: duration_ms
      - labels:
          level:
          method:
          route:
          status:
